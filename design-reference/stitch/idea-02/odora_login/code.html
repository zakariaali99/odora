<script>
  // Simple interaction for showing/hiding password
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Tactile Face ID animation mockup feedback
  const faceIdBtn = document.getElementById('faceIdBtn');
  if (faceIdBtn) {
    faceIdBtn.addEventListener('click', () => {
      const originalText = faceIdBtn.innerHTML;
      faceIdBtn.innerHTML = `
        <span class="material-symbols-outlined text-primary text-[20px] animate-spin">progress_activity</span>
        <span>Scanning Face ID...</span>
      `;
      setTimeout(() => {
        faceIdBtn.innerHTML = `
          <span class="material-symbols-outlined text-primary text-[20px]">check_circle</span>
          <span>Verified Elena</span>
        `;
        setTimeout(() => {
          faceIdBtn.innerHTML = originalText;
        }, 1800);
      }, 1000);
    });
  }
