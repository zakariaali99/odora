<!-- Subtle Micro-mist Particle Badge -->
<div class="absolute bottom-3 left-3 bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center space-x-1.5 shadow-sm" id="tech-badge">
<span class="material-symbols-outlined text-primary text-[18px]">air</span>

</div>

      </div>
</div>
<!-- Carousel Narrative Content Area -->
<div class="w-full text-center mt-6 px-1 flex flex-col items-center">
<div class="inline-flex items-center space-x-1.5 px-3 py-0.5 rounded-full bg-secondary-container/40 text-on-secondary-container font-label-sm text-label-sm mb-3">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>

</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-normal tracking-tight min-h-[44px]" id="slide-title">
        Atmosphere, Perfected.
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2.5 max-w-xs leading-relaxed min-h-[66px]" id="slide-desc">
        Waterless cold-air micro-misting preserves uncompromised therapeutic botanicals without heat, breakdown, or dilution.
      </p>
<!-- Carousel Pagination Pill Indicators -->
<div class="flex items-center justify-center space-x-2 mt-6" role="tablist">

<div class="grid grid-cols-3 gap-2 py-1">

<span class="material-symbols-outlined text-primary text-[20px] mb-1">schedule</span>

<span class="font-body-sm text-body-sm text-on-surface-variant">Circadian sync</span>
</div>

<!-- Action Stack -->
<div class="flex flex-col space-y-3 pt-2">
<button class="w-full h-14 bg-inverse-surface hover:bg-inverse-surface/90 active:scale-[0.99] text-inverse-on-surface font-label-lg text-label-lg rounded-full shadow-md flex items-center justify-center space-x-2 transition-all" id="primary-cta">
<span id="cta-label">Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

<button class="font-label-md text-label-md text-outline hover:text-on-surface disabled:opacity-30 flex items-center space-x-1" disabled="" id="prev-btn">
<span class="material-symbols-outlined text-[16px]">west</span>
<span>Previous</span>
</button>

        Pair Diffuser Manual
      </button>

<script>
  (function() {
    const slides = [
      {
        tag: "TECHNOLOGY • PURITY",
        title: "Atmosphere, Perfected.",
        desc: "Waterless cold-air micro-misting preserves uncompromised therapeutic botanicals without heat, breakdown, or dilution.",
        badge: "Cold Diffusion Active",
        icon: "air",
        step: "01",
        btnText: "Continue",
        imgPrompt: "Sculptural minimal matte sage green cylinder electronic diffuser standing serenely on a pale travertine stone slab, accompanied by an amber glass essential oil bottle labeled 'odora Forest Sage' and soft cedar branches in an artisanal ceramic vase. Soft daylight, warm alabaster sanctuary ambiance, editorial luxury interior."
      },
      {
        tag: "RITUALS • CONTROL",
        title: "Intelligent Harmony.",
        desc: "Fine-tune mist intensity, create circadian automated scent schedules, and choreograph multiple rooms with BLE responsiveness.",
        badge: "BLE 5.3 Connected",
        icon: "tune",
        step: "02",
        btnText: "Continue",
        imgPrompt: "Editorial lifestyle shot of a modern serene living room side table featuring the matte sage green Odora smart fragrance device, subtle natural vapor rising into soft sunlight, minimalist ceramic cup and architectural book nearby."
      },
      {
        tag: "SOURCING • BOTANICALS",
        title: "Kyoto to Grasse.",
        desc: "Curated wildcrafted master oils extracted from sustainably harvested hinoki wood, bergamot rind, and rare high-elevation herbs.",
        badge: "100% Sustainable",
        icon: "eco",
        step: "03",
        btnText: "Get Started",
        imgPrompt: "Warm artisanal still life of three dark amber apothecary dropper bottles labeled Odora beside crushed green botanical leaves, dried sage twigs, and smooth limestone pebbles under warm ambient studio lighting."
      }
    ];

    let currentIndex = 0;

    const imgEl = document.getElementById("carousel-img");
    const tagEl = document.getElementById("slide-tag");
    const titleEl = document.getElementById("slide-title");
    const descEl = document.getElementById("slide-desc");
    const badgeLabel = document.getElementById("tech-badge-label");
    const badgeIcon = document.querySelector("#tech-badge .material-symbols-outlined");
    const stepEl = document.getElementById("step-counter");
    const ctaLabel = document.getElementById("cta-label");
    const primaryCta = document.getElementById("primary-cta");
    const prevBtn = document.getElementById("prev-btn");
    const dots = document.querySelectorAll(".carousel-dot");

    function renderSlide(index) {
      const slide = slides[index];

      // Cross-fade image
      imgEl.classList.add("opacity-0");
      setTimeout(() => {
        imgEl.setAttribute("data-alt", slide.imgPrompt);
        imgEl.classList.remove("opacity-0");
      }, 200);

      // Text swap
      tagEl.textContent = slide.tag;
      titleEl.textContent = slide.title;
      descEl.textContent = slide.desc;
      badgeLabel.textContent = slide.badge;
      badgeIcon.textContent = slide.icon;
      stepEl.textContent = slide.step;
      ctaLabel.textContent = slide.btnText;

      // Update dots
      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.className = "carousel-dot h-2 w-8 rounded-full bg-primary-container transition-all duration-300";
        } else {
          dot.className = "carousel-dot h-2 w-2 rounded-full bg-outline-variant/60 transition-all duration-300";
        }
      });

      // Controls state
      prevBtn.disabled = index === 0;
    }

    primaryCta.addEventListener("click", () => {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      } else {
        // Final completion flash
        primaryCta.classList.add("bg-primary");
        ctaLabel.textContent = "Connecting to Device...";
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    });

    dots.forEach(dot => {
      dot.addEventListener("click", () => {
        currentIndex = parseInt(dot.getAttribute("data-index"), 10);
        renderSlide(currentIndex);
      });
    });

    document.getElementById("skip-btn").addEventListener("click", () => {
      currentIndex = slides.length - 1;
      renderSlide(currentIndex);
    });
  })();
</script></main></body></html>
