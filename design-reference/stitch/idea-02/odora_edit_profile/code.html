</div>
<button aria-label="Change Sanctuary Portrait" class="absolute bottom-1 right-1 w-9 h-9 rounded-full bg-on-background text-surface flex items-center justify-center shadow-md active:scale-95 transition-transform" id="avatar-edit-trigger" type="button">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
</div>
<button class="text-label-lg font-label-lg text-primary hover:text-on-primary-container transition-colors py-1 flex items-center gap-1 active:opacity-75" type="button">
<span>Change Sanctuary Portrait</span>
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-1">
        JPG or PNG format, up to 5MB
      </p>
</div>
<form class="flex flex-col gap-space-md w-full" onsubmit="event.preventDefault();">
<div class="bg-surface-container-lowest rounded-lg p-space-md shadow-sm flex flex-col gap-space-xs transition-all focus-within:shadow-md">
<div class="flex items-center justify-between">
<label class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5" for="fullName">
<span class="material-symbols-outlined text-[16px] text-tertiary">person</span>
            Full Name
          </label>
</div>
<div class="flex items-center">
<input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface focus:outline-none placeholder:text-outline" id="fullName" name="fullName" placeholder="Enter full name" type="text" value="Julian Vance"/>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-space-md shadow-sm flex flex-col gap-space-xs transition-all focus-within:shadow-md">
<div class="flex items-center justify-between">
<label class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5" for="email">
<span class="material-symbols-outlined text-[16px] text-tertiary">mail</span>
            Email Address
          </label>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">verified</span>
            Verified
          </span>
</div>
<div class="flex items-center">
<input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface focus:outline-none placeholder:text-outline" id="email" name="email" placeholder="Enter email address" type="email" value="julian.vance@studio.com"/>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-space-md shadow-sm flex flex-col gap-space-xs transition-all focus-within:shadow-md">
<label class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5" for="phone">
<span class="material-symbols-outlined text-[16px] text-tertiary">call</span>
          Mobile Number
        </label>
<div class="flex items-center gap-space-sm">
<button aria-label="Select Country Code" class="h-9 px-2.5 rounded-full bg-surface-container flex items-center gap-1.5 text-label-md font-label-md text-on-surface shrink-0 active:scale-95 transition-transform" type="button">
<span class="text-body-md leading-none select-none">🇦🇪</span>
<span class="text-on-surface-variant">+971</span>
<span class="material-symbols-outlined text-[16px] text-outline">expand_more</span>
</button>
<input class="w-full bg-transparent text-body-lg font-body-lg text-on-surface focus:outline-none placeholder:text-outline" id="phone" name="phone" placeholder="Phone number" type="tel" value="50 892 4190"/>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-space-md shadow-sm flex flex-col gap-space-xs relative group cursor-pointer">
<label class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5 pointer-events-none">
<span class="material-symbols-outlined text-[16px] text-tertiary">spa</span>

<div class="flex items-center justify-between pt-0.5">

<span class="text-body-md font-body-md text-on-surface truncate">Woody &amp; Herbaceous (Hinoki &amp; Cedar)</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">unfold_more</span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-space-md shadow-sm flex flex-col gap-space-xs relative group cursor-pointer">
<label class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5 pointer-events-none">
<span class="material-symbols-outlined text-[16px] text-tertiary">chair</span>
          Default Sanctuary Room
        </label>
<div class="flex items-center justify-between pt-0.5">
<div class="flex items-center gap-2 min-w-0 pr-2">
<span class="w-2.5 h-2.5 rounded-full bg-secondary shrink-0"></span>
<span class="text-body-md font-body-md text-on-surface truncate">Living Room Atelier</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">unfold_more</span>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-space-md flex items-start gap-space-sm mt-space-xs">
<div class="w-7 h-7 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant leading-relaxed">
          Your personal data is encrypted and synced with your Odora cloud sanctuary vault.
        </p>
</div>
<div class="flex flex-col gap-space-sm pt-space-md w-full">
<button class="w-full h-14 rounded-full bg-inverse-surface text-inverse-on-surface text-label-lg font-label-lg shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all hover:bg-on-background" id="save-profile-btn" type="submit">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Save Profile Changes</span>
</button>
<button class="w-full h-12 rounded-full bg-transparent text-tertiary text-label-md font-label-md flex items-center justify-center hover:text-on-surface active:opacity-75 transition-colors" onclick="history.back()" type="button">
          Discard Changes
        </button>
</div>
</form>
</div>
</div>
<script>
  (function() {
    const saveBtn = document.getElementById('save-profile-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Syncing Vault...</span>';
        saveBtn.disabled = true;
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Sanctuary Updated</span>';
          setTimeout(() => {
            saveBtn.innerHTML = originalText;
            saveBtn.disabled = false;
          }, 1800);
        }, 900);
      });
    }

    const avatarBtn = document.getElementById('avatar-edit-trigger');
    if (avatarBtn) {
      avatarBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        avatarBtn.classList.add('rotate-45');
        setTimeout(() => avatarBtn.classList.remove('rotate-45'), 300);
      });
    }
  })();
</script></main></body></html>
