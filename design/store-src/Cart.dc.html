<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
    *{box-sizing:border-box;}

    a{color:#464F39;text-decoration:none;} a:hover{color:#919C7A;}

  </style>
</helmet>
<div style="position:relative;width:1440px;min-height:1080px;background:#F4F0EC;overflow:hidden;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:26px 80px;border-bottom:1px solid #EAE6DF;">

    <div style="display:flex;gap:40px;font-size:15px;"><a href="#">Shop</a><a href="#">Fragrances</a><a href="#">Technology</a><a href="#">About</a></div>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2B26" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#919C7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    </div>
  </div>

  <div style="padding:48px 80px 6px;font-size:44px;font-weight:300;">Your cart</div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:44px;padding:30px 80px 60px;align-items:start;">
    <!-- items -->
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="background:#FFFFFF;border-radius:20px;padding:22px;display:flex;gap:22px;align-items:center;box-shadow:0 8px 24px rgba(70,79,57,0.05);">

        <div style="flex:1;"><div style="font-size:18px;font-weight:500;">Odora Diffuser</div><div style="font-size:14px;color:#8F8F82;margin-top:4px;">Sage Green</div><div style="font-size:17px;font-weight:500;color:#464F39;margin-top:12px;">320 LYD</div></div>
        <div style="display:flex;align-items:center;gap:14px;"><span style="width:34px;height:34px;border-radius:11px;background:#F0ECE4;display:flex;align-items:center;justify-content:center;color:#8F8F82;font-size:18px;">−</span><span style="font-size:15px;">1</span><span style="width:34px;height:34px;border-radius:11px;background:#919C7A;display:flex;align-items:center;justify-content:center;color:#F4F0EC;font-size:18px;">+</span></div>
      </div>
      <div style="background:#FFFFFF;border-radius:20px;padding:22px;display:flex;gap:22px;align-items:center;box-shadow:0 8px 24px rgba(70,79,57,0.05);">
        <div style="width:90px;height:120px;background:#F1EDE6;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;"><div style="width:44px;height:82px;background:linear-gradient(160deg,#6B4A24,#4A3115);border-radius:8px;position:relative;"><span style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:11px;border-radius:2px;background:#1C1C1A;"></span></div></div>
        <div style="flex:1;"><div style="font-size:18px;font-weight:500;">Forest Sage</div><div style="font-size:14px;color:#8F8F82;margin-top:4px;">Premium oil · 10ml</div><div style="font-size:17px;font-weight:500;color:#464F39;margin-top:12px;">45 LYD</div></div>
        <div style="display:flex;align-items:center;gap:14px;"><span style="width:34px;height:34px;border-radius:11px;background:#F0ECE4;display:flex;align-items:center;justify-content:center;color:#8F8F82;font-size:18px;">−</span><span style="font-size:15px;">2</span><span style="width:34px;height:34px;border-radius:11px;background:#919C7A;display:flex;align-items:center;justify-content:center;color:#F4F0EC;font-size:18px;">+</span></div>
      </div>
    </div>

    <!-- summary -->
    <div style="background:#FFFFFF;border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(70,79,57,0.06);">
      <div style="font-size:20px;font-weight:500;">Order summary</div>
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#8F8F82;margin-top:22px;"><span>Subtotal</span><span style="color:#2B2B26;">410 LYD</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#8F8F82;margin-top:12px;"><span>Delivery</span><span style="color:#919C7A;">Free</span></div>
      <div style="height:1px;background:#EAE6DF;margin:20px 0;"></div>
      <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:500;"><span>Total</span><span style="color:#464F39;">410 LYD</span></div>
      <div style="height:60px;border-radius:30px;background:#1C1C1A;color:#F4F0EC;display:flex;align-items:center;justify-content:center;margin-top:26px;font-size:16px;">Checkout</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:20px;background:#E1F2BD;border-radius:14px;padding:14px 16px;color:#464F39;font-size:13.5px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#464F39" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        You've unlocked free delivery
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
